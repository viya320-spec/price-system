<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>守葳體系 醫美價目表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c;
  --gold-light: #e8cc7a;
  --gold-dim: #8a6e2f;
  --dark: #0f1117;
  --dark2: #181b23;
  --dark3: #1f2330;
  --border: rgba(201,168,76,0.22);
  --text: #f0ece2;
  --text-dim: #8a8680;
  --accent: #e07a50;
  --red: #e05050;
  --green: #4eaa7a;
  --blue: #5a80c0;
  --TAB_H: 56px;
  --HEADER_H: 60px;
}
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; overflow:hidden; }
body {
  background: var(--dark);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 15px;
}

/* ── HEADER ── */
.header {
  position: fixed; top:0; left:0; right:0; z-index:200;
  height: var(--HEADER_H);
  background: #0a0c12;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 14px;
  gap: 10px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.7);
}
.logo-badge {
  width: 38px; height: 38px; flex-shrink:0;
  background: linear-gradient(135deg, var(--gold), #7a5820);
  border-radius: 9px;
  display: flex; align-items:center; justify-content:center;
  font-size: 13px; font-weight: 900; color: #000;
}
.logo-text { flex:1; min-width:0; }
.logo-text h1 { font-size:15px; font-weight:800; color:var(--gold); letter-spacing:1px; }
.logo-text p { font-size:10px; color:var(--text-dim); letter-spacing:2px; }
.search-btn {
  width:40px; height:40px; flex-shrink:0;
  background: var(--dark3); border:1px solid var(--border);
  border-radius:10px; display:flex; align-items:center; justify-content:center;
  font-size:18px; cursor:pointer;
}

/* ── SEARCH OVERLAY ── */
.search-overlay {
  position: fixed; inset:0; z-index:500;
  background: rgba(0,0,0,0.85);
  display:none; flex-direction:column;
  padding: 16px;
}
.search-overlay.open { display:flex; }
.search-bar {
  display:flex; gap:10px; align-items:center;
  background: var(--dark2);
  border: 1px solid var(--gold);
  border-radius: 12px;
  padding: 12px 14px;
}
.search-bar input {
  flex:1; background:none; border:none; outline:none;
  color:var(--text); font-size:17px;
  font-family: 'Noto Sans TC', sans-serif;
}
.search-bar input::placeholder { color:var(--text-dim); }
.search-close {
  color:var(--gold); font-size:20px; cursor:pointer; padding:4px;
}
.search-results {
  flex:1; overflow-y:auto; margin-top:14px;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.search-result-item {
  padding:14px; border-bottom:1px solid rgba(255,255,255,0.06);
  cursor:pointer;
}
.search-result-item:active { background:rgba(201,168,76,0.08); }
.sri-name { font-size:15px; color:var(--text); font-weight:500; }
.sri-meta { font-size:12px; color:var(--text-dim); margin-top:3px; }
.sri-price { font-size:17px; font-weight:800; color:var(--gold-light); float:right; }
.search-empty { padding:40px; text-align:center; color:var(--text-dim); font-size:15px; }

/* ── BOTTOM TABS ── */
.bottom-tabs {
  position: fixed; bottom:0; left:0; right:0; z-index:200;
  height: var(--TAB_H);
  background: #0a0c12;
  border-top: 1px solid var(--border);
  display: flex;
}
.btab {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:2px; cursor:pointer;
  color: var(--text-dim);
  font-size:10px; font-weight:500;
  border-top: 2px solid transparent;
  transition: all 0.15s;
  padding: 6px 0;
  letter-spacing:0.2px;
}
.btab .icon { font-size:20px; line-height:1; }
.btab.active { color:var(--gold); border-top-color:var(--gold); }

/* ── MAIN CONTENT AREA ── */
.content-area {
  position: fixed;
  top: var(--HEADER_H);
  bottom: var(--TAB_H);
  left:0; right:0;
  overflow:hidden;
  display:flex; flex-direction:column;
}

/* ── PANEL ── */
.panel { display:none; flex-direction:column; height:100%; }
.panel.active { display:flex; }

/* ── CATEGORY BAR (horizontal scroll) ── */
.cat-bar {
  background: var(--dark2);
  border-bottom: 1px solid var(--border);
  display:flex; overflow-x:auto; gap:0;
  scrollbar-width:none; flex-shrink:0;
}
.cat-bar::-webkit-scrollbar { display:none; }
.cat-btn {
  padding: 13px 16px;
  font-size: 13px; font-weight:600;
  color: var(--text-dim); white-space:nowrap;
  border-bottom: 3px solid transparent;
  cursor:pointer; transition:all 0.15s;
  flex-shrink:0;
}
.cat-btn.active { color:var(--gold); border-bottom-color:var(--gold); background:rgba(201,168,76,0.06); }
.cat-btn:active { background:rgba(255,255,255,0.04); }

/* ── SUB CATEGORY BAR ── */
.subcat-bar {
  background: var(--dark3);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display:flex; overflow-x:auto; gap:6px;
  padding: 8px 12px; flex-shrink:0;
  scrollbar-width:none;
}
.subcat-bar::-webkit-scrollbar { display:none; }
.subcat-btn {
  padding: 8px 14px; border-radius:20px;
  font-size:13px; font-weight:500;
  color:var(--text-dim); white-space:nowrap;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  cursor:pointer; flex-shrink:0; transition:all 0.15s;
}
.subcat-btn.active {
  color:var(--gold); background:rgba(201,168,76,0.12);
  border-color:var(--border);
}

/* ── SCROLL CONTENT ── */
.scroll-content {
  flex:1; overflow-y:auto;
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
  padding-bottom: 16px;
}
.scroll-content::-webkit-scrollbar { width:4px; }
.scroll-content::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

/* ── ITEM ROWS ── */
.item-row {
  display:flex; align-items:center;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  gap:10px;
}
.item-row:active { background:rgba(201,168,76,0.05); }
.item-row .item-info { flex:1; min-width:0; }
.item-row .item-name { font-size:15px; color:var(--text); line-height:1.4; font-weight:500; }
.item-row .item-meta { font-size:11px; color:var(--text-dim); margin-top:3px; }
.item-row .item-code { font-family:monospace; }
.item-row .item-right { text-align:right; flex-shrink:0; }
.item-row .item-price { font-size:18px; font-weight:800; color:var(--gold-light); }
.item-row .item-unit { font-size:11px; color:var(--text-dim); display:block; }
.store-tag {
  display:inline-block; font-size:10px;
  background:rgba(90,128,192,0.15); color:var(--blue);
  border:1px solid rgba(90,128,192,0.2);
  border-radius:4px; padding:1px 5px; margin-left:4px;
}

/* ── PACKAGE CARDS ── */
.pkg-card {
  margin: 10px 12px;
  background: var(--dark2);
  border: 1px solid var(--border);
  border-radius: 14px; overflow:hidden;
}
.pkg-card.limited-pkg {
  border-color: rgba(224,80,80,0.5);
  background: linear-gradient(135deg, rgba(224,80,80,0.05) 0%, var(--dark2) 100%);
}
/* BIG WARNING BANNER */
.limit-warning {
  background: var(--red);
  color:#fff;
  padding: 10px 14px;
  display:flex; align-items:center; gap:8px;
  font-size:14px; font-weight:800; letter-spacing:0.5px;
}
.limit-warning .warn-icon { font-size:18px; }

.pkg-header {
  padding: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
}
.pkg-name { font-size:15px; font-weight:700; color:var(--text); line-height:1.45; }
.pkg-code { font-size:11px; color:var(--text-dim); font-family:monospace; margin-top:3px; }
.pkg-price { font-size:22px; font-weight:900; color:var(--gold); white-space:nowrap; flex-shrink:0; }
.pkg-items { padding: 10px 14px; }
.pkg-item-row {
  display:flex; align-items:center; gap:8px;
  padding: 7px 0;
  border-bottom: 1px solid rgba(255,255,255,0.04);
}
.pkg-item-row:last-child { border-bottom:none; }
.pkg-item-code { font-family:monospace; font-size:11px; color:var(--text-dim); flex-shrink:0; width:68px; }
.pkg-item-name { flex:1; font-size:14px; color:var(--text); }
.pkg-item-sessions {
  font-size:12px; font-weight:700; color:var(--accent);
  background:rgba(224,122,80,0.12); border-radius:6px;
  padding: 3px 8px; flex-shrink:0;
}
.pkg-footer { padding:8px 14px 12px; }
.pkg-note { font-size:12px; color:var(--text-dim); }
.pkg-note.expiry { color:var(--green); }

/* ── PROMO CARD ── */
.promo-card {
  margin:10px 12px;
  background: linear-gradient(135deg, rgba(224,122,80,0.1) 0%, var(--dark2) 100%);
  border: 1px solid rgba(224,122,80,0.35);
  border-radius: 14px; padding:16px;
}
.promo-title { font-size:16px; font-weight:700; color:#f0a070; margin-bottom:8px; }
.promo-desc { font-size:14px; color:var(--text); line-height:1.65; }
.promo-period {
  margin-top:10px; font-size:13px; color:var(--accent);
  font-weight:600; display:flex; align-items:center; gap:6px;
}

/* ── STORAGE CARDS ── */
.storage-note {
  margin:10px 12px;
  background:rgba(240,192,64,0.07);
  border: 1px solid rgba(240,192,64,0.2);
  border-radius:12px; padding:14px;
  font-size:13px; color:var(--text-dim); line-height:1.85;
}
.storage-card {
  margin: 8px 12px;
  background: linear-gradient(135deg, rgba(240,192,64,0.08) 0%, var(--dark2) 100%);
  border: 1px solid rgba(240,192,64,0.25);
  border-radius: 14px; padding:14px;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.sc-name { font-size:14px; font-weight:600; color:#f0c040; line-height:1.4; }
.sc-code { font-size:11px; color:var(--text-dim); font-family:monospace; margin-top:2px; }
.sc-price { font-size:21px; font-weight:900; color:var(--gold); flex-shrink:0; }

/* ── SECTION TITLE ── */
.section-heading {
  padding: 14px 16px 6px;
  font-size:12px; font-weight:700;
  color:var(--text-dim); letter-spacing:2px;
  text-transform:uppercase;
}

/* ── EMPTY STATE ── */
.empty-state {
  padding:60px 20px; text-align:center;
  color:var(--text-dim); font-size:15px; line-height:1.8;
}

/* ── PRODUCT CARDS ── */
.product-row {
  display:flex; align-items:center;
  padding: 14px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  gap:12px;
}
.product-icon {
  width:44px; height:44px; flex-shrink:0;
  background:rgba(201,168,76,0.1); border-radius:10px;
  display:flex; align-items:center; justify-content:center;
  font-size:20px;
}
</style>
</head>

const fmt = n => '$' + n.toLocaleString();

function pkgCardHTML(p) {
  const limitBanner = p.limited
    ? `<div class="limit-warning"><span class="warn-icon">🚫</span>⚠️ 限購一組・不可扣儲值・不可轉贈</div>`
    : '';
  const itemsHTML = p.items.map(it => `
    <div class="pkg-item-row">
      <span class="pkg-item-code">${it.code}</span>
      <span class="pkg-item-name">${it.name}</span>
      ${it.sessions ? `<span class="pkg-item-sessions">${it.sessions}次</span>` : ''}
    </div>`).join('');
  const noteClass = p.note && p.note.includes('下架') ? 'pkg-note' : 'pkg-note expiry';
  return `
    <div class="pkg-card ${p.limited ? 'limited-pkg' : ''}">
      ${limitBanner}
      <div class="pkg-header">
        <div style="flex:1;min-width:0">
          <div class="pkg-name">${p.name}</div>
          <div class="pkg-code">${p.code}${p.store ? ' · '+p.store : ''}</div>
        </div>
        <div class="pkg-price">${fmt(p.price)}</div>
      </div>
      <div class="pkg-items">${itemsHTML}</div>
      ${p.note ? `<div class="pkg-footer"><span class="${noteClass}">📅 ${p.note}</span></div>` : ''}
    </div>`;
}

// ════════════════════════════════
//  ITEMS PANEL
// ════════════════════════════════
(function buildItems() {
  const cats = Object.keys(ITEMS_DATA);
  let activeCat = cats[0];
  let activeSub = Object.keys(ITEMS_DATA[activeCat])[0];
  const catBar = document.getElementById('itemsCatBar');
  const subBar = document.getElementById('itemsSubBar');
  const content = document.getElementById('itemsContent');

  function renderCats() {
    catBar.innerHTML = cats.map(c =>
      `<div class="cat-btn ${c===activeCat?'active':''}" data-cat="${c}">${c}</div>`
    ).join('');
    catBar.querySelectorAll('.cat-btn').forEach(b => b.addEventListener('click', () => {
      activeCat = b.dataset.cat;
      activeSub = Object.keys(ITEMS_DATA[activeCat])[0];
      renderCats(); renderSubs(); renderRows();
    }));
  }

  function renderSubs() {
    const subs = Object.keys(ITEMS_DATA[activeCat]);
    subBar.innerHTML = subs.map(s =>
      `<div class="subcat-btn ${s===activeSub?'active':''}" data-sub="${s}">${s}</div>`
    ).join('');
    subBar.querySelectorAll('.subcat-btn').forEach(b => b.addEventListener('click', () => {
      activeSub = b.dataset.sub;
      renderSubs(); renderRows();
    }));
  }

  function renderRows() {
    const rows = ITEMS_DATA[activeCat][activeSub];
    content.innerHTML = rows.map(r => `
      <div class="item-row">
        <div class="item-info">
          <div class="item-name">${r.name}</div>
          <div class="item-meta">
            <span class="item-code">${r.code}</span>
            <span class="store-tag">${r.store||'守蔵'}</span>
          </div>
        </div>
        <div class="item-right">
          <div class="item-price">${fmt(r.price)}</div>
          <span class="item-unit">${r.unit}</span>
        </div>
      </div>`).join('');
  }

  renderCats(); renderSubs(); renderRows();
})();

// ════════════════════════════════
//  SEARCH
// ════════════════════════════════
// Build flat search index
const searchIndex = [];
Object.entries(ITEMS_DATA).forEach(([cat, subs]) => {
  Object.entries(subs).forEach(([sub, rows]) => {
    rows.forEach(r => searchIndex.push({
      type:'item', cat, sub,
      name:r.name, code:r.code, price:r.price, unit:r.unit, store:r.store||'守蔵',
      text:(r.name+r.code).toLowerCase()
    }));
  });
});
[...MJL_PACKAGES, ...PACKAGES_DATA].forEach(p => {
  searchIndex.push({
    type:'pkg', limited:p.limited,
    name:p.name, code:p.code, price:p.price,
    text:(p.name+p.code).toLowerCase()
  });
});
STORAGE_DATA.forEach(s => {
  searchIndex.push({type:'storage', name:s.name, code:s.code, price:s.price, unit:s.unit, text:(s.name+s.code).toLowerCase()});
});
Object.values(PRODUCTS_DATA).flat().forEach(r => {
  searchIndex.push({type:'product', name:r.name, code:r.code, price:r.price, unit:r.unit, text:(r.name+r.code).toLowerCase()});
});

document.getElementById('openSearch').addEventListener('click', () => {
  document.getElementById('searchOverlay').classList.add('open');
  setTimeout(() => document.getElementById('searchInput').focus(), 100);
});
document.getElementById('closeSearch').addEventListener('click', () => {
  document.getElementById('searchOverlay').classList.remove('open');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '<div class="search-empty">輸入關鍵字開始搜尋</div>';
});

document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  const res = document.getElementById('searchResults');
  if (!q) { res.innerHTML = '<div class="search-empty">輸入關鍵字開始搜尋</div>'; return; }
  const hits = searchIndex.filter(x => x.text.includes(q)).slice(0, 40);
  if (!hits.length) { res.innerHTML = '<div class="search-empty">找不到相關項目</div>'; return; }
  res.innerHTML = hits.map(h => {
    const typeBadge = h.type==='pkg' ? (h.limited
      ? `<span style="color:var(--red);font-weight:800">🚫 限購一組</span>` : '套組')
      : h.type==='storage' ? '儲值' : h.type==='product' ? '產品' : `${h.cat} › ${h.sub}`;
    return `<div class="search-result-item">
      <div><span class="sri-price">${fmt(h.price)}</span>
      <div class="sri-name">${h.name}</div></div>
      <div class="sri-meta">${h.code} · ${typeBadge}${h.unit?' · '+h.unit:''}</div>
    </div>`;
  }).join('');
});
</script>
