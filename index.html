<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>守葳體系 醫美價目表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- ★ 每月只換 data.js，這個檔案永遠不用動 ★ -->
<script src="data.js"></script>
<style>
:root{
  --gold:#a3771f;        /* 主色（深金，白底上對比夠） */
  --gl:#8a611a;          /* 代號/強調字 */
  --bg:#ffffff;          /* 全域白底 */
  --panel:#ffffff;       /* 卡片底 */
  --panel2:#faf7f0;      /* 次要底（分類條、子分類條） */
  --line:#e7e0cf;        /* 邊框線（淺金） */
  --txt:#161616;         /* 主文字：接近黑，最高對比 */
  --dim:#6b6b6b;         /* 次要文字 */
  --red:#c62828;
  --redbg:#fdecec;
  --org:#b5541a;
  --orgbg:#fdf1e6;
  --grn:#2e7d4f;
  --blu:#2f5fa3;
  --blubg:#eef3fb;
  --HD:64px;--TAB:76px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--bg);color:var(--txt);font-family:'Noto Sans TC',sans-serif;}

/* Header */
.hd{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--HD);background:#ffffff;border-bottom:2px solid var(--gold);display:flex;align-items:center;padding:0 14px;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.logo{width:42px;height:42px;flex-shrink:0;border-radius:9px;background:linear-gradient(135deg,#c9a84c,#8a611a);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#fff;}
.lt{flex:1;}.lt h1{font-size:17px;font-weight:900;color:var(--gold);letter-spacing:1px;}.lt p{font-size:11px;color:var(--dim);letter-spacing:1.5px;}
.sbtn2{width:46px;height:46px;flex-shrink:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;}

/* Search overlay */
.sov{position:fixed;inset:0;z-index:500;background:rgba(255,255,255,.98);display:none;flex-direction:column;padding:16px;}
.sov.open{display:flex;}
.sbar{display:flex;gap:10px;align-items:center;background:var(--panel2);border:2px solid var(--gold);border-radius:12px;padding:12px 14px;}
.sbar input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:19px;font-family:'Noto Sans TC',sans-serif;font-weight:500;}
.sbar input::placeholder{color:var(--dim);}
.scls{color:var(--gold);font-size:26px;cursor:pointer;padding:4px;font-weight:700;}
.sres{flex:1;overflow-y:auto;margin-top:12px;}
.sri{padding:16px 6px;border-bottom:1px solid var(--line);}
.sri-t{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;}
.scode{font-family:monospace;font-size:19px;font-weight:900;color:var(--gl);background:#f5eddb;border:1px solid var(--line);padding:5px 11px;border-radius:6px;flex-shrink:0;}
.sprice{font-size:22px;font-weight:900;color:var(--gold);flex-shrink:0;}
.sname{font-size:17px;color:var(--txt);font-weight:600;line-height:1.5;}
.smeta{font-size:12px;color:var(--dim);margin-top:4px;}
.sempty{padding:40px;text-align:center;color:var(--dim);font-size:16px;}

/* Bottom tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:200;height:var(--TAB);background:#ffffff;border-top:2px solid var(--gold);display:flex;box-shadow:0 -2px 10px rgba(0,0,0,.06);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--dim);font-size:12px;font-weight:700;border-top:3px solid transparent;}
.tab .ic{font-size:26px;line-height:1;}.tab.on{color:var(--gold);border-top-color:var(--gold);background:#faf5e8;}

.ca{position:fixed;top:var(--HD);bottom:var(--TAB);left:0;right:0;overflow:hidden;}
.pn{display:none;flex-direction:column;height:100%;}.pn.on{display:flex;}

/* Category bar (top-level) */
.cb{background:var(--panel2);border-bottom:1px solid var(--line);display:flex;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.cb::-webkit-scrollbar{display:none;}
.cbtn{padding:15px 18px;font-size:15px;font-weight:800;color:var(--dim);white-space:nowrap;border-bottom:4px solid transparent;cursor:pointer;flex-shrink:0;}
.cbtn.on{color:var(--gold);border-bottom-color:var(--gold);background:#ffffff;}

/* Sub-category bar (pill) */
.sb{background:#ffffff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;gap:8px;padding:10px 12px;flex-shrink:0;scrollbar-width:none;}
.sb::-webkit-scrollbar{display:none;}
.sbtnn{padding:9px 16px;border-radius:20px;font-size:14px;font-weight:700;color:var(--dim);white-space:nowrap;background:var(--panel2);border:1px solid var(--line);cursor:pointer;flex-shrink:0;}
.sbtnn.on{color:#fff;background:var(--gold);border-color:var(--gold);}

.sc{flex:1;overflow-y:auto;padding-bottom:16px;}

/* Item rows */
.ir{display:flex;align-items:center;padding:16px;border-bottom:1px solid var(--line);gap:10px;}
.ir:active{background:#faf5e8;}
.ii{flex:1;min-width:0;}
.icode{display:inline-block;font-family:monospace;font-size:18px;font-weight:900;color:var(--gl);background:#f5eddb;border:1px solid var(--line);border-radius:6px;padding:5px 11px;margin-bottom:7px;letter-spacing:.5px;}
.iname{font-size:17px;color:var(--txt);line-height:1.5;font-weight:600;}
.imeta{font-size:12px;color:var(--dim);margin-top:4px;}
.irg{text-align:right;flex-shrink:0;}
.iprice{font-size:20px;font-weight:900;color:var(--gl);}
.iunit{font-size:12px;color:var(--dim);display:block;margin-top:2px;}
.stag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:4px;background:var(--blubg);color:var(--blu);border:1px solid #cddaef;margin-left:4px;font-weight:700;}

/* Package card */
.pc{margin:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.pc.lim{border:2px solid var(--red);}
.pc.nos{border:2px solid var(--org);}
.lban{background:var(--red);color:#fff;padding:12px 14px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;}
.nban{background:var(--org);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:800;}
.wban{background:var(--orgbg);color:var(--org);padding:10px 14px;font-size:13px;line-height:1.7;font-weight:700;border-bottom:1px solid #f0d9c0;}
.ph{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.pcode{display:inline-block;font-family:monospace;font-size:18px;font-weight:900;color:var(--gl);background:#f5eddb;border:1px solid var(--line);border-radius:7px;padding:5px 11px;margin-bottom:7px;letter-spacing:.5px;}
.pname{font-size:17px;font-weight:800;color:var(--txt);line-height:1.5;}
.pstore{font-size:12px;color:var(--dim);margin-top:4px;}
.pprice{font-size:25px;font-weight:900;color:var(--gold);white-space:nowrap;flex-shrink:0;}
.pit{padding:10px 14px;}
.pirow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f1ece0;}
.pirow:last-child{border-bottom:none;}
.picode{font-family:monospace;font-size:14px;font-weight:800;color:var(--gl);background:#f5eddb;border-radius:5px;padding:3px 8px;flex-shrink:0;min-width:78px;text-align:center;}
.piname{flex:1;font-size:15px;color:var(--txt);font-weight:500;}
.pises{font-size:13px;font-weight:800;color:var(--org);background:var(--orgbg);border-radius:6px;padding:3px 9px;flex-shrink:0;}
.pft{padding:10px 14px 14px;}
.pnt{font-size:13px;color:var(--grn);font-weight:700;}
.pnt.out{color:var(--dim);}
.sh{padding:16px 16px 8px;font-size:12px;font-weight:900;color:var(--gold);letter-spacing:2px;text-transform:uppercase;}

/* Promo card */
.prc{margin:12px;background:linear-gradient(135deg,var(--orgbg),#ffffff);border:1px solid #f0d9c0;border-radius:14px;padding:18px;}
.prt{font-size:17px;font-weight:900;color:var(--org);margin-bottom:10px;}
.prd{font-size:15px;color:var(--txt);line-height:1.75;}
.prp{margin-top:12px;font-size:14px;color:var(--org);font-weight:800;}

/* Storage note + card */
.stnote{margin:12px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:16px;font-size:14px;color:var(--txt);line-height:2;font-weight:500;}
.notice{margin:12px;background:var(--redbg);border:2px solid var(--red);border-radius:14px;overflow:hidden;}
.notice-hd{background:var(--red);color:#fff;padding:12px 16px;font-size:15px;font-weight:900;display:flex;align-items:center;gap:8px;}
.notice-bd{padding:16px;font-size:14px;color:var(--txt);line-height:1.9;font-weight:500;}
.notice-bd b{color:var(--red);}
.notice-ex{margin-top:10px;background:#ffffff;border:1px solid #f0c0c0;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--txt);line-height:1.85;}
.notice-date{padding:8px 16px 14px;font-size:12px;color:var(--dim);}
.stcard{margin:10px 12px;background:#ffffff;border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.scname{font-size:16px;font-weight:700;color:var(--txt);line-height:1.5;}
.sccode{font-size:12px;color:var(--dim);font-family:monospace;margin-top:3px;}
.scprice{font-size:23px;font-weight:900;color:var(--gold);flex-shrink:0;}

/* Font-size toggle (accessibility for presbyopia) */
.fsbtn{width:46px;height:46px;flex-shrink:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--gold);cursor:pointer;}
body.big .iname,body.big .pname,body.big .piname,body.big .sname{font-size:120%!important;}
body.big .iprice,body.big .pprice,body.big .scprice,body.big .sprice{font-size:115%!important;}
body.big .icode,body.big .pcode,body.big .scode{font-size:110%!important;}
</style>
</head>
<body>

<div class="hd">
  <div class="logo">守葳</div>
  <div class="lt"><h1>守葳體系</h1><p id="ver">醫美價目表</p></div>
  <div class="fsbtn" id="fsToggle" title="放大字級">A+</div>
  <div class="sbtn2" id="openS">🔍</div>
</div>

<div class="sov" id="sov">
  <div class="sbar">
    <span style="font-size:20px">🔍</span>
    <input type="text" id="si" placeholder="輸入 S編號 或 關鍵字…" autocomplete="off">
    <span class="scls" id="cls">✕</span>
  </div>
  <div class="sres" id="sres"><div class="sempty">輸入 S編號 或 關鍵字開始搜尋</div></div>
</div>

<div class="ca">
  <div class="pn on" id="pn-items"><div class="cb" id="iCB"></div><div class="sb" id="iSB"></div><div class="sc" id="iC"></div></div>
  <div class="pn" id="pn-pkg"><div class="cb" id="pkgCB"></div><div class="sc" id="pkgC"></div></div>
  <div class="pn" id="pn-mjl"><div class="cb" id="mjlCB"></div><div class="sc" id="mjlC"></div></div>
  <div class="pn" id="pn-promo"><div class="sc" id="proC"></div></div>
  <div class="pn" id="pn-storage"><div class="sc" id="stC"></div></div>
  <div class="pn" id="pn-products"><div class="cb" id="proCB"></div><div class="sc" id="proC2"></div></div>
  <div class="pn" id="pn-trial"><div class="cb" id="trialCB"></div><div class="sc" id="trialC"></div></div>
</div>

<div class="tabs">
  <div class="tab on" data-p="items"><span class="ic">📋</span>項目</div>
  <div class="tab" data-p="pkg"><span class="ic">🗂</span>常態套組</div>
  <div class="tab" data-p="mjl"><span class="ic">💉</span>猛健樂</div>
  <div class="tab" data-p="promo"><span class="ic">⭐</span>檔期/活動</div>
  <div class="tab" data-p="storage"><span class="ic">💳</span>儲值</div>
  <div class="tab" data-p="products"><span class="ic">🧴</span>產品</div>
  <div class="tab" data-p="trial"><span class="ic">🎫</span>體驗價</div>
</div>

<script>
const fmt=n=>n!=null?'$'+n.toLocaleString():'依開單';
const $=id=>document.getElementById(id);
$('ver').textContent='醫美價目表 '+DATA_VERSION;

function pkgCard(p){
  let b='';
  if(p.limited) b+=`<div class="lban">🚫 限購一組・不可扣儲值・不可轉贈</div>`;
  else if(p.noStorage) b+=`<div class="nban">⛔ 不可扣儲值・不可轉贈</div>`;
  if(p.warn) b+=`<div class="wban">⚠️ ${p.warn}</div>`;
  const its=(p.items||[]).map(i=>`<div class="pirow"><span class="picode">${i.code}</span><span class="piname">${i.name}</span>${i.ses!=null?`<span class="pises">${i.ses}次</span>`:''}</div>`).join('');
  const nc=p.note&&p.note.includes('下架')?'pnt out':'pnt';
  return `<div class="pc ${p.limited?'lim':p.noStorage?'nos':''}">${b}<div class="ph"><div style="flex:1;min-width:0"><div class="pcode">${p.code}</div><div class="pname">${p.name}</div>${p.store?`<div class="pstore">🏪 ${p.store}</div>`:''}</div><div class="pprice">${fmt(p.price)}</div></div><div class="pit">${its}</div>${p.note?`<div class="pft"><span class="${nc}">📅 ${p.note}</span></div>`:''}</div>`;
}

function makeCB(el,keys,gA,sA,cb){
  el.innerHTML=keys.map(k=>`<div class="cbtn ${k===gA()?'on':''}" data-k="${k}">${k}</div>`).join('');
  el.querySelectorAll('.cbtn').forEach(b=>b.addEventListener('click',()=>{sA(b.dataset.k);makeCB(el,keys,gA,sA,cb);cb();}));
}

// ① 項目
(function(){
  const cats=Object.keys(ITEMS);
  let aC=cats[0],aS=Object.keys(ITEMS[aC])[0];
  function rS(){
    $('iSB').innerHTML=Object.keys(ITEMS[aC]).map(s=>`<div class="sbtnn ${s===aS?'on':''}" data-s="${s}">${s}</div>`).join('');
    $('iSB').querySelectorAll('.sbtnn').forEach(b=>b.addEventListener('click',()=>{aS=b.dataset.s;rS();rR();}));
  }
  function rR(){
    $('iC').innerHTML=ITEMS[aC][aS].map(r=>`<div class="ir"><div class="ii"><div class="icode">${r.code}</div><div class="iname">${r.name}</div><div class="imeta"><span class="stag">${r.store||'守蔵'}</span></div></div><div class="irg"><div class="iprice">${fmt(r.price)}</div><span class="iunit">${r.unit}</span></div></div>`).join('');
  }
  makeCB($('iCB'),cats,()=>aC,k=>{aC=k;aS=Object.keys(ITEMS[k])[0];},()=>{rS();rR();});
  rS();rR();
})();

// ② 常態套組
(function(){
  const cats=Object.keys(PACKAGES);let aC=cats[0];
  makeCB($('pkgCB'),cats,()=>aC,k=>{aC=k;},()=>{$('pkgC').innerHTML=PACKAGES[aC].map(pkgCard).join('');});
  $('pkgC').innerHTML=PACKAGES[aC].map(pkgCard).join('');
})();

// ③ 猛健樂
(function(){
  const cats=Object.keys(MJL);let aC=cats[0];
  function rC(){$('mjlC').innerHTML=MJL[aC].map(p=>pkgCard({...p,limited:p.limited||false,noStorage:p.noStorage||false,store:p.store||'守蔵',note:p.note||'',warn:p.warn||''})).join('');}
  makeCB($('mjlCB'),cats,()=>aC,k=>{aC=k;},rC);rC();
})();

// ④ 檔期/活動
(function(){
  let h='<div class="sh">當期檔期套組</div>';
  h+=PROMO_PKGS.map(pkgCard).join('');
  h+='<div class="sh" style="margin-top:10px">當月活動公告</div>';
  h+=PROMO_ACTIVITIES.map(a=>`<div class="prc"><div class="prt">🎁 ${a.name}</div><div class="prd">${a.desc}</div><div class="prp">⏰ ${a.period}</div></div>`).join('');
  $('proC').innerHTML=h;
})();

// ⑤ 儲值
(function(){
  const notices=(typeof POLICY_NOTICES!=='undefined'?POLICY_NOTICES:[]).map(n=>`
    <div class="notice">
      <div class="notice-hd">🚨 ${n.title}</div>
      <div class="notice-bd">${n.body}</div>
      ${n.example?`<div class="notice-bd" style="padding-top:0"><div class="notice-ex">${n.example}</div></div>`:''}
      ${n.date?`<div class="notice-date">📅 ${n.date}</div>`:''}
    </div>`).join('');
  $('stC').innerHTML=notices
    +`<div class="stnote">✅ 項目、卡項、全套組可扣（特殊套組不可扣時會標註）<br>✅ 儲值金額完款後，後贈金額才會產生<br>✅ 後贈金額僅能扣項目原價（體驗價不適用）<br>✅ 以上方案不分現金、刷卡及中租</div>`
    +STORAGE.map(s=>`<div class="stcard"><div><div class="scname">${s.name}</div><div class="sccode">${s.code} · ${s.unit}</div></div><div class="scprice">${fmt(s.price)}</div></div>`).join('');
})();

// ⑥ 產品
(function(){
  const cats=Object.keys(PRODUCTS);let aC=cats[0];
  function rR(){$('proC2').innerHTML=PRODUCTS[aC].map(r=>`<div class="ir"><div class="ii"><div class="icode">${r.code}</div><div class="iname">${r.name}</div></div><div class="irg"><div class="iprice">${fmt(r.price)}</div><span class="iunit">${r.unit}</span></div></div>`).join('');}
  makeCB($('proCB'),cats,()=>aC,k=>{aC=k;},rR);rR();
})();

// ⑦ 體驗價
(function(){
  const cats=Object.keys(TRIAL);let aC=cats[0];
  function rR(){$('trialC').innerHTML=TRIAL[aC].map(r=>`<div class="ir"><div class="ii"><div class="icode">${r.code}</div><div class="iname">${r.name}</div><div class="imeta"><span class="stag">${r.store||'守蔵'}</span>${r.warn?`<span style="color:var(--org);font-size:12px;margin-left:6px;font-weight:700">⛔ ${r.warn}</span>`:''}</div></div><div class="irg"><div class="iprice">${fmt(r.price)}</div><span class="iunit">${r.unit||'次'}</span></div></div>`).join('');}
  makeCB($('trialCB'),cats,()=>aC,k=>{aC=k;},rR);rR();
})();

// Tabs
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  const id='pn-'+t.dataset.p;
  document.querySelectorAll('.pn').forEach(p=>p.classList.toggle('on',p.id===id));
}));

// 字級放大切換（老花友善）
$('fsToggle').addEventListener('click',()=>{document.body.classList.toggle('big');});

// 搜尋索引
const IDX=[];
Object.entries(ITEMS).forEach(([cat,subs])=>Object.entries(subs).forEach(([sub,rows])=>rows.forEach(r=>IDX.push({type:'項目',cat,sub,limited:false,noStorage:false,code:r.code,name:r.name,price:r.price,unit:r.unit,store:r.store||'守蔵',txt:(r.name+r.code).toLowerCase()}))));
Object.entries(PACKAGES).forEach(([cat,pkgs])=>pkgs.forEach(p=>IDX.push({type:'常態套組',cat,limited:p.limited,noStorage:p.noStorage,code:p.code,name:p.name,price:p.price,store:p.store||'',txt:(p.name+p.code).toLowerCase()})));
Object.entries(MJL).forEach(([cat,pkgs])=>pkgs.forEach(p=>IDX.push({type:'猛健樂',cat,limited:p.limited||false,noStorage:p.noStorage||false,code:p.code,name:p.name,price:p.price,store:'守蔵',txt:(p.name+p.code).toLowerCase()})));
PROMO_PKGS.forEach(p=>IDX.push({type:'檔期',limited:p.limited,noStorage:p.noStorage,code:p.code,name:p.name,price:p.price,store:p.store||'',txt:(p.name+p.code).toLowerCase()}));
STORAGE.forEach(s=>IDX.push({type:'儲值',limited:false,noStorage:false,code:s.code,name:s.name,price:s.price,unit:s.unit,txt:(s.name+s.code).toLowerCase()}));
Object.values(PRODUCTS).flat().forEach(r=>IDX.push({type:'產品',limited:false,noStorage:false,code:r.code,name:r.name,price:r.price,unit:r.unit,txt:(r.name+r.code).toLowerCase()}));
Object.entries(TRIAL).forEach(([cat,rows])=>rows.forEach(r=>IDX.push({type:'體驗價',cat,limited:r.limited||false,noStorage:r.noStorage||false,code:r.code,name:r.name,price:r.price,unit:r.unit||'次',store:r.store||'守蔵',txt:(r.name+r.code).toLowerCase()})));

$('openS').addEventListener('click',()=>{$('sov').classList.add('open');setTimeout(()=>$('si').focus(),100);});
$('cls').addEventListener('click',()=>{$('sov').classList.remove('open');$('si').value='';$('sres').innerHTML='<div class="sempty">輸入 S編號 或 關鍵字開始搜尋</div>';});
$('si').addEventListener('input',function(){
  const q=this.value.trim().toLowerCase();
  if(!q){$('sres').innerHTML='<div class="sempty">輸入 S編號 或 關鍵字開始搜尋</div>';return;}
  const hits=IDX.filter(x=>x.txt.includes(q)).slice(0,60);
  if(!hits.length){$('sres').innerHTML='<div class="sempty">找不到相關項目</div>';return;}
  $('sres').innerHTML=hits.map(h=>{
    let w='';
    if(h.limited) w='<span style="color:var(--red);font-weight:900;font-size:13px">🚫限購一組 </span>';
    else if(h.noStorage) w='<span style="color:var(--org);font-weight:800;font-size:13px">⛔不可扣儲值 </span>';
    return `<div class="sri"><div class="sri-t"><span class="scode">${h.code}</span><span class="sprice">${fmt(h.price)}</span></div><div class="sname">${w}${h.name}</div><div class="smeta">${[h.type,h.cat,h.unit,h.store].filter(Boolean).join(' · ')}</div></div>`;
  }).join('');
});
</script>
</body>
</html>
