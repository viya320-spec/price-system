<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>守葳體系 醫美價目表</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<!-- ★ 每月只換 data.js，這個檔案永遠不用動 ★ -->
<script src="data.js"></script>
<style>
:root{--gold:#c9a84c;--gl:#e8cc7a;--dark:#0f1117;--d2:#181b23;--d3:#1f2330;--bd:rgba(201,168,76,.22);--txt:#f0ece2;--dim:#8a8680;--red:#e05050;--grn:#4eaa7a;--blu:#5a80c0;--org:#e07a50;--HD:62px;--TAB:72px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{background:var(--dark);color:var(--txt);font-family:'Noto Sans TC',sans-serif;}
.hd{position:fixed;top:0;left:0;right:0;z-index:200;height:var(--HD);background:#0a0c12;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 14px;gap:10px;box-shadow:0 2px 20px rgba(0,0,0,.7);}
.logo{width:40px;height:40px;flex-shrink:0;border-radius:9px;background:linear-gradient(135deg,var(--gold),#7a5820);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;color:#000;}
.lt{flex:1;}.lt h1{font-size:15px;font-weight:800;color:var(--gold);letter-spacing:1px;}.lt p{font-size:10px;color:var(--dim);letter-spacing:2px;}
.sbtn2{width:42px;height:42px;flex-shrink:0;background:var(--d3);border:1px solid var(--bd);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;}
.sov{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.93);display:none;flex-direction:column;padding:16px;}
.sov.open{display:flex;}
.sbar{display:flex;gap:10px;align-items:center;background:var(--d2);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;}
.sbar input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:17px;font-family:'Noto Sans TC',sans-serif;}
.sbar input::placeholder{color:var(--dim);}
.scls{color:var(--gold);font-size:22px;cursor:pointer;padding:4px;}
.sres{flex:1;overflow-y:auto;margin-top:12px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent;}
.sri{padding:14px 4px;border-bottom:1px solid rgba(255,255,255,.06);}
.sri-t{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px;}
.scode{font-family:monospace;font-size:18px;font-weight:900;color:var(--gl);background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.25);padding:4px 10px;border-radius:6px;flex-shrink:0;}
.sprice{font-size:19px;font-weight:900;color:var(--gold);flex-shrink:0;}
.sname{font-size:15px;color:var(--txt);font-weight:500;line-height:1.4;}
.smeta{font-size:11px;color:var(--dim);margin-top:3px;}
.sempty{padding:40px;text-align:center;color:var(--dim);font-size:15px;}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:200;height:var(--TAB);background:#0a0c12;border-top:1px solid var(--bd);display:flex;}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--dim);font-size:11px;font-weight:700;border-top:2px solid transparent;}
.tab .ic{font-size:24px;line-height:1;}.tab.on{color:var(--gold);border-top-color:var(--gold);}
.ca{position:fixed;top:var(--HD);bottom:var(--TAB);left:0;right:0;overflow:hidden;}
.pn{display:none;flex-direction:column;height:100%;}.pn.on{display:flex;}
.cb{background:var(--d2);border-bottom:1px solid var(--bd);display:flex;overflow-x:auto;scrollbar-width:none;flex-shrink:0;}
.cb::-webkit-scrollbar{display:none;}
.cbtn{padding:13px 16px;font-size:13px;font-weight:700;color:var(--dim);white-space:nowrap;border-bottom:3px solid transparent;cursor:pointer;flex-shrink:0;}
.cbtn.on{color:var(--gold);border-bottom-color:var(--gold);background:rgba(201,168,76,.06);}
.sb{background:var(--d3);border-bottom:1px solid rgba(255,255,255,.06);display:flex;overflow-x:auto;gap:6px;padding:8px 12px;flex-shrink:0;scrollbar-width:none;}
.sb::-webkit-scrollbar{display:none;}
.sbtnn{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--dim);white-space:nowrap;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);cursor:pointer;flex-shrink:0;}
.sbtnn.on{color:var(--gold);background:rgba(201,168,76,.12);border-color:var(--bd);}
.sc{flex:1;overflow-y:auto;padding-bottom:16px;scrollbar-width:thin;scrollbar-color:var(--bd) transparent;}
.sc::-webkit-scrollbar{width:4px;}.sc::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px;}
.ir{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.05);gap:10px;}
.ir:active{background:rgba(201,168,76,.05);}.ii{flex:1;min-width:0;}
.icode{display:inline-block;font-family:monospace;font-size:17px;font-weight:900;color:var(--gl);background:rgba(201,168,76,.13);border:1px solid rgba(201,168,76,.22);border-radius:6px;padding:4px 10px;margin-bottom:6px;letter-spacing:.5px;}
.iname{font-size:15px;color:var(--txt);line-height:1.4;font-weight:500;}.imeta{font-size:11px;color:var(--dim);margin-top:3px;}
.irg{text-align:right;flex-shrink:0;}.iprice{font-size:18px;font-weight:900;color:var(--gl);}.iunit{font-size:11px;color:var(--dim);display:block;}
.stag{display:inline-block;font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(90,128,192,.15);color:var(--blu);border:1px solid rgba(90,128,192,.2);margin-left:4px;}
.pc{margin:10px 12px;background:var(--d2);border:1px solid var(--bd);border-radius:14px;overflow:hidden;}
.pc.lim{border-color:rgba(224,80,80,.5);}.pc.nos{border-color:rgba(176,88,32,.5);}
.lban{background:var(--red);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;}
.nban{background:#7a3800;color:#ffd090;padding:8px 14px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;}
.wban{background:#3a2800;color:#ffc060;padding:8px 14px;font-size:12px;line-height:1.6;}
.ph{padding:14px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.pcode{display:inline-block;font-family:monospace;font-size:17px;font-weight:900;color:var(--gl);background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.25);border-radius:7px;padding:4px 10px;margin-bottom:6px;letter-spacing:.5px;}
.pname{font-size:15px;font-weight:700;color:var(--txt);line-height:1.45;}.pstore{font-size:11px;color:var(--dim);margin-top:3px;}
.pprice{font-size:23px;font-weight:900;color:var(--gold);white-space:nowrap;flex-shrink:0;}
.pit{padding:10px 14px;}
.pirow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);}
.pirow:last-child{border-bottom:none;}
.picode{font-family:monospace;font-size:13px;font-weight:800;color:var(--gl);background:rgba(201,168,76,.1);border-radius:5px;padding:2px 7px;flex-shrink:0;min-width:72px;text-align:center;}
.piname{flex:1;font-size:14px;color:var(--txt);}
.pises{font-size:12px;font-weight:700;color:var(--org);background:rgba(224,122,80,.12);border-radius:6px;padding:3px 8px;flex-shrink:0;}
.pft{padding:8px 14px 12px;}.pnt{font-size:12px;color:var(--grn);}.pnt.out{color:var(--dim);}
.sh{padding:14px 16px 6px;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:2px;text-transform:uppercase;}
.prc{margin:10px 12px;background:linear-gradient(135deg,rgba(224,122,80,.1),var(--d2));border:1px solid rgba(224,122,80,.35);border-radius:14px;padding:16px;}
.prt{font-size:16px;font-weight:700;color:#f0a070;margin-bottom:8px;}.prd{font-size:14px;color:var(--txt);line-height:1.65;}.prp{margin-top:10px;font-size:13px;color:var(--org);font-weight:600;}
.stnote{margin:10px 12px;background:rgba(240,192,64,.07);border:1px solid rgba(240,192,64,.2);border-radius:12px;padding:14px;font-size:13px;color:var(--dim);line-height:1.85;}
.stcard{margin:8px 12px;background:linear-gradient(135deg,rgba(240,192,64,.08),var(--d2));border:1px solid rgba(240,192,64,.25);border-radius:14px;padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.scname{font-size:14px;font-weight:600;color:#f0c040;line-height:1.4;}.sccode{font-size:11px;color:var(--dim);font-family:monospace;margin-top:2px;}
.scprice{font-size:21px;font-weight:900;color:var(--gold);flex-shrink:0;}
</style>
</head>
<body>

<div class="hd">
  <div class="logo">守葳</div>
  <div class="lt"><h1>守葳體系</h1><p id="ver">醫美價目表</p></div>
  <div class="sbtn2" id="openS">🔍</div>
</div>

<div class="sov" id="sov">
  <div class="sbar">
    <span style="font-size:18px">🔍</span>
    <input type="text" id="si" placeholder="輸入 S編號 或 關鍵字…" autocomplete="off">
    <span class="scls" id="cls">✕</span>
  </div>
  <div class="sres" id="sres"><div class="sempty">輸入 S編號 或 關鍵字開始搜尋</div></div>
</div>

<div class="ca">
  <div class="pn on" id="pn-items"><div class="cb" id="iCB"></div><div class="sb" id="iSB"></div><div class="sc" id="iC"></div></div>
  <div class="pn" id="pn-pkg"><div class="cb" id="pkgCB"></div><div class="sc" id="pkgC"></div></div>
  <div class="pn" id="pn-mjl"><div class="cb" id="mjlCB"></div><div class="sc" id="mjlC"></div></div>
  <div class="pn" id="pn-promo"><div class="sc" id="proC"></div></div>
  <div class="pn" id="pn-storage"><div class="sc" id="stC"></div></div>
  <div class="pn" id="pn-products"><div class="cb" id="proCB"></div><div class="sc" id="proC2"></div></div>
</div>

<div class="tabs">
  <div class="tab on" data-p="items"><span class="ic">📋</span>項目</div>
  <div class="tab" data-p="pkg"><span class="ic">🗂</span>常態套組</div>
  <div class="tab" data-p="mjl"><span class="ic">💉</span>猛健樂</div>
  <div class="tab" data-p="promo"><span class="ic">⭐</span>檔期/活動</div>
  <div class="tab" data-p="storage"><span class="ic">💳</span>儲值</div>
  <div class="tab" data-p="products"><span class="ic">🧴</span>產品</div>
</div>

<script>
const fmt=n=>n!=null?'$'+n.toLocaleString():'依開單';
const $=id=>document.getElementById(id);
$('ver').textContent='醫美價目表 '+DATA_VERSION;

function pkgCard(p){
  let b='';
  if(p.limited) b+=`<div class="lban">🚫 ⚠️ 限購一組・不可扣儲值・不可轉贈</div>`;
  else if(p.noStorage) b+=`<div class="nban">⛔ 不可扣儲值・不可轉贈</div>`;
  if(p.warn) b+=`<div class="wban">⚠️ ${p.warn}</div>`;
  const its=(p.items||[]).map(i=>`<div class="pirow"><span class="picode">${i.code}</span><span class="piname">${i.name}</span>${i.ses!=null?`<span class="pises">${i.ses}次</span>`:''}</div>`).join('');
  const nc=p.note&&p.note.includes('下架')?'pnt out':'pnt';
  return `<div class="pc ${p.limited?'lim':p.noStorage?'nos':''}">${b}<div class="ph"><div style="flex:1;min-width:0"><div class="pcode">${p.code}</div><div class="pname">${p.name}</div>${p.store?`<div class="pstore">🏪 ${p.store}</div>`:''}</div><div class="pprice">${fmt(p.price)}</div></div><div class="pit">${its}</div>${p.note?`<div class="pft"><span class="${nc}">📅 ${p.note}</span></div>`:''}</div>`;
}

function makeCB(el,keys,gA,sA,cb){
  el.innerHTML=keys.map(k=>`<div class="cbtn ${k===gA()?'on':''}" data-k="${k}">${k}</div>`).join('');
  el.querySelectorAll('.cbtn').forEach(b=>b.addEventListener('click',()=>{sA(b.dataset.k);makeCB(el,keys,gA,sA,cb);cb();}));
}

// ① 項目
(function(){
  const cats=Object.keys(ITEMS);
  let aC=cats[0],aS=Object.keys(ITEMS[aC])[0];
  function rS(){
    $('iSB').innerHTML=Object.keys(ITEMS[aC]).map(s=>`<div class="sbtnn ${s===aS?'on':''}" data-s="${s}">${s}</div>`).join('');
    $('iSB').querySelectorAll('.sbtnn').forEach(b=>b.addEventListener('click',()=>{aS=b.dataset.s;rS();rR();}));
  }
  function rR(){
    $('iC').innerHTML=ITEMS[aC][aS].map(r=>`<div class="ir"><div class="ii"><div class="icode">${r.code}</div><div class="iname">${r.name}</div><div class="imeta"><span class="stag">${r.store||'守蔵'}</span></div></div><div class="irg"><div class="iprice">${fmt(r.price)}</div><span class="iunit">${r.unit}</span></div></div>`).join('');
  }
  makeCB($('iCB'),cats,()=>aC,k=>{aC=k;aS=Object.keys(ITEMS[k])[0];},()=>{rS();rR();});
  rS();rR();
})();

// ② 常態套組
(function(){
  const cats=Object.keys(PACKAGES);let aC=cats[0];
  makeCB($('pkgCB'),cats,()=>aC,k=>{aC=k;},()=>{$('pkgC').innerHTML=PACKAGES[aC].map(pkgCard).join('');});
  $('pkgC').innerHTML=PACKAGES[aC].map(pkgCard).join('');
})();

// ③ 猛健樂
(function(){
  const cats=Object.keys(MJL);let aC=cats[0];
  function rC(){$('mjlC').innerHTML=MJL[aC].map(p=>pkgCard({...p,limited:false,noStorage:false,store:'守蔵',note:'',warn:''})).join('');}
  makeCB($('mjlCB'),cats,()=>aC,k=>{aC=k;},rC);rC();
})();

// ④ 檔期/活動
(function(){
  let h='<div class="sh">115年度檔期套組</div>';
  h+=PROMO_PKGS.map(pkgCard).join('');
  h+='<div class="sh" style="margin-top:10px">當月活動公告</div>';
  h+=PROMO_ACTIVITIES.map(a=>`<div class="prc"><div class="prt">🎁 ${a.name}</div><div class="prd">${a.desc}</div><div class="prp">⏰ ${a.period}</div></div>`).join('');
  $('proC').innerHTML=h;
})();

// ⑤ 儲值
(function(){
  $('stC').innerHTML=`<div class="stnote">✅ 項目、卡項、全套組可扣（特殊套組不可扣時會標註）<br>✅ 儲值金額完款後，後贈金額才會產生<br>✅ 後贈金額僅能扣項目原價（體驗價不適用）<br>✅ 以上方案不分現金、刷卡及中租</div>`
    +STORAGE.map(s=>`<div class="stcard"><div><div class="scname">${s.name}</div><div class="sccode">${s.code} · ${s.unit}</div></div><div class="scprice">${fmt(s.price)}</div></div>`).join('');
})();

// ⑥ 產品
(function(){
  const cats=Object.keys(PRODUCTS);let aC=cats[0];
  function rR(){$('proC2').innerHTML=PRODUCTS[aC].map(r=>`<div class="ir"><div class="ii"><div class="icode">${r.code}</div><div class="iname">${r.name}</div></div><div class="irg"><div class="iprice">${fmt(r.price)}</div><span class="iunit">${r.unit}</span></div></div>`).join('');}
  makeCB($('proCB'),cats,()=>aC,k=>{aC=k;},rR);rR();
})();

// Tabs
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  t.classList.add('on');
  const id='pn-'+t.dataset.p;
  document.querySelectorAll('.pn').forEach(p=>p.classList.toggle('on',p.id===id));
}));

// 搜尋索引
const IDX=[];
Object.entries(ITEMS).forEach(([cat,subs])=>Object.entries(subs).forEach(([sub,rows])=>rows.forEach(r=>IDX.push({type:'項目',cat,sub,limited:false,noStorage:false,code:r.code,name:r.name,price:r.price,unit:r.unit,store:r.store||'守蔵',txt:(r.name+r.code).toLowerCase()}))));
Object.entries(PACKAGES).forEach(([cat,pkgs])=>pkgs.forEach(p=>IDX.push({type:'常態套組',cat,limited:p.limited,noStorage:p.noStorage,code:p.code,name:p.name,price:p.price,store:p.store||'',txt:(p.name+p.code).toLowerCase()})));
Object.entries(MJL).forEach(([cat,pkgs])=>pkgs.forEach(p=>IDX.push({type:'猛健樂',cat,limited:false,noStorage:false,code:p.code,name:p.name,price:p.price,store:'守蔵',txt:(p.name+p.code).toLowerCase()})));
PROMO_PKGS.forEach(p=>IDX.push({type:'檔期',limited:p.limited,noStorage:p.noStorage,code:p.code,name:p.name,price:p.price,store:p.store||'',txt:(p.name+p.code).toLowerCase()}));
STORAGE.forEach(s=>IDX.push({type:'儲值',limited:false,noStorage:false,code:s.code,name:s.name,price:s.price,unit:s.unit,txt:(s.name+s.code).toLowerCase()}));
Object.values(PRODUCTS).flat().forEach(r=>IDX.push({type:'產品',limited:false,noStorage:false,code:r.code,name:r.name,price:r.price,unit:r.unit,txt:(r.name+r.code).toLowerCase()}));

$('openS').addEventListener('click',()=>{$('sov').classList.add('open');setTimeout(()=>$('si').focus(),100);});
$('cls').addEventListener('click',()=>{$('sov').classList.remove('open');$('si').value='';$('sres').innerHTML='<div class="sempty">輸入 S編號 或 關鍵字開始搜尋</div>';});
$('si').addEventListener('input',function(){
  const q=this.value.trim().toLowerCase();
  if(!q){$('sres').innerHTML='<div class="sempty">輸入 S編號 或 關鍵字開始搜尋</div>';return;}
  const hits=IDX.filter(x=>x.txt.includes(q)).slice(0,60);
  if(!hits.length){$('sres').innerHTML='<div class="sempty">找不到相關項目</div>';return;}
  $('sres').innerHTML=hits.map(h=>{
    let w='';
    if(h.limited) w='<span style="color:var(--red);font-weight:900;font-size:12px">🚫限購一組 </span>';
    else if(h.noStorage) w='<span style="color:#e09040;font-weight:700;font-size:12px">⛔不可扣儲值 </span>';
    return `<div class="sri"><div class="sri-t"><span class="scode">${h.code}</span><span class="sprice">${fmt(h.price)}</span></div><div class="sname">${w}${h.name}</div><div class="smeta">${[h.type,h.cat,h.unit,h.store].filter(Boolean).join(' · ')}</div></div>`;
  }).join('');
});
</script>
</body>
</html>
