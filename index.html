<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>守葳體系 醫美價目表系統</title>

<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8cc7a;
    --gold-dim: #8a6e2f;
    --black: #0a0a0a;
    --dark: #111318;
    --dark2: #1a1d24;
    --dark3: #22262f;
    --border: rgba(201,168,76,0.2);
    --text: #e8e4dc;
    --text-dim: #8a8680;
    --accent: #d4845a;
    --green: #5a9e7a;
    --blue: #5a7aae;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--dark);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    background: linear-gradient(135deg, #0a0a0a 0%, #111318 50%, #0d1017 100%);
    border-bottom: 1px solid var(--border);
    padding: 0 0 0 0;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 40px rgba(0,0,0,0.6);
  }
  .header-inner {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px;
  }
  .logo {
    display: flex; align-items: center; gap: 14px;
  }
  .logo-mark {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 900; color: #000;
    letter-spacing: -1px;
    box-shadow: 0 2px 16px rgba(201,168,76,0.3);
  }
  .logo-text h1 {
    font-size: 18px; font-weight: 700; color: var(--gold);
    letter-spacing: 2px;
  }
  .logo-text p {
    font-size: 11px; color: var(--text-dim); letter-spacing: 3px;
    text-transform: uppercase;
  }
  .header-meta {
    display: flex; align-items: center; gap: 16px;
  }
  .update-badge {
    background: rgba(201,168,76,0.1);
    border: 1px solid var(--border);
    color: var(--gold-light);
    padding: 5px 12px; border-radius: 20px;
    font-size: 11px; letter-spacing: 1px;
  }
  .search-wrap {
    position: relative;
  }
  .search-input {
    background: var(--dark3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 8px 14px 8px 36px;
    font-size: 13px; width: 220px;
    font-family: 'Noto Sans TC', sans-serif;
    transition: all 0.2s;
  }
  .search-input:focus { outline: none; border-color: var(--gold); width: 260px; }
  .search-input::placeholder { color: var(--text-dim); }
  .search-icon {
    position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
    color: var(--text-dim); font-size: 14px;
  }

  /* NAV TABS */
  .nav-tabs {
    display: flex; gap: 0;
    padding: 0 28px;
    border-top: 1px solid rgba(255,255,255,0.04);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tab {
    padding: 10px 18px;
    font-size: 12px; font-weight: 500;
    color: var(--text-dim);
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    letter-spacing: 0.5px;
    position: relative;
  }
  .nav-tab:hover { color: var(--text); }
  .nav-tab.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
  }
  .nav-tab .tab-count {
    display: inline-block;
    background: rgba(201,168,76,0.15);
    color: var(--gold-dim);
    border-radius: 10px;
    padding: 1px 6px; font-size: 10px;
    margin-left: 5px;
  }
  .nav-tab.active .tab-count {
    background: rgba(201,168,76,0.25);
    color: var(--gold);
  }

  /* LAYOUT */
  .layout { display: flex; height: calc(100vh - 105px); }

  /* SIDEBAR */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--dark2);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .sidebar-section { padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .sidebar-label {
    padding: 0 16px 8px;
    font-size: 10px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 2px;
  }
  .sidebar-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; cursor: pointer;
    font-size: 13px; color: var(--text-dim);
    transition: all 0.15s; border-left: 2px solid transparent;
  }
  .sidebar-item:hover { background: rgba(201,168,76,0.05); color: var(--text); }
  .sidebar-item.active {
    background: rgba(201,168,76,0.08);
    color: var(--gold);
    border-left-color: var(--gold);
  }
  .sidebar-item .count {
    font-size: 10px; color: var(--text-dim);
    background: rgba(255,255,255,0.06);
    padding: 2px 6px; border-radius: 8px;
  }
  .sidebar-item.active .count { color: var(--gold-dim); }

  /* MAIN CONTENT */
  .main { flex: 1; overflow-y: auto; padding: 24px 28px; }

  /* SECTION HEADER */
  .section-header {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 20px; padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }
  .section-title {
    font-size: 20px; font-weight: 700; color: var(--gold);
    letter-spacing: 1px;
  }
  .section-sub { font-size: 13px; color: var(--text-dim); }
  .result-count { font-size: 12px; color: var(--text-dim); margin-left: auto; }

  /* TABLE */
  .price-table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
  }
  .price-table thead th {
    background: rgba(201,168,76,0.08);
    color: var(--gold-dim);
    font-weight: 500;
    padding: 10px 14px;
    text-align: left;
    font-size: 11px; letter-spacing: 1px;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .price-table tbody tr {
    border-bottom: 1px solid rgba(255,255,255,0.04);
    transition: background 0.15s;
  }
  .price-table tbody tr:hover { background: rgba(201,168,76,0.04); }
  .price-table tbody td {
    padding: 10px 14px; vertical-align: top;
  }
  .code { font-family: monospace; color: var(--text-dim); font-size: 11px; }
  .price { font-weight: 700; color: var(--gold-light); white-space: nowrap; }
  .unit { font-size: 11px; color: var(--text-dim); }
  .store-tag {
    display: inline-block;
    font-size: 10px; padding: 2px 7px; border-radius: 4px;
    background: rgba(90,122,174,0.15); color: var(--blue);
    border: 1px solid rgba(90,122,174,0.2);
  }
  .highlight-yellow { color: #f0c040; }
  .highlight-green { color: var(--green); }
  .highlight-blue { color: var(--blue); }
  .note-text { font-size: 11px; color: var(--text-dim); }

  /* PACKAGE CARDS for 套組 */
  .pkg-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 14px;
  }
  .pkg-card {
    background: var(--dark2);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    transition: all 0.2s;
  }
  .pkg-card:hover {
    border-color: rgba(201,168,76,0.4);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transform: translateY(-1px);
  }
  .pkg-header {
    padding: 12px 14px;
    background: rgba(201,168,76,0.06);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between; gap: 10px;
  }
  .pkg-name {
    font-size: 13px; font-weight: 600; color: var(--text);
    flex: 1; line-height: 1.4;
  }
  .pkg-code { font-size: 10px; color: var(--text-dim); font-family: monospace; margin-top: 3px; }
  .pkg-price {
    font-size: 17px; font-weight: 900; color: var(--gold);
    white-space: nowrap;
  }
  .pkg-items { padding: 10px 14px; }
  .pkg-item-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    gap: 8px;
  }
  .pkg-item-row:last-child { border-bottom: none; }
  .pkg-item-code { font-family: monospace; font-size: 10px; color: var(--text-dim); flex-shrink: 0; }
  .pkg-item-name { font-size: 12px; color: var(--text); flex: 1; }
  .pkg-item-sessions {
    font-size: 11px; color: var(--accent);
    background: rgba(212,132,90,0.1);
    padding: 2px 7px; border-radius: 4px; flex-shrink: 0;
    white-space: nowrap;
  }
  .limited-badge {
    display: inline-block;
    background: rgba(212,132,90,0.15); color: var(--accent);
    border: 1px solid rgba(212,132,90,0.3);
    font-size: 10px; padding: 2px 7px; border-radius: 4px;
    margin-top: 4px;
  }
  .pkg-footer {
    padding: 6px 14px 10px;
  }

  /* PROMO / 活動 */
  .promo-card {
    background: linear-gradient(135deg, rgba(212,132,90,0.08) 0%, var(--dark2) 100%);
    border: 1px solid rgba(212,132,90,0.3);
    border-radius: 10px; padding: 14px;
    margin-bottom: 12px;
  }
  .promo-card .promo-name { font-size: 14px; font-weight: 600; color: #e8a87a; margin-bottom: 6px; }
  .promo-card .promo-desc { font-size: 12px; color: var(--text-dim); line-height: 1.6; }
  .promo-card .promo-period { font-size: 11px; color: var(--accent); margin-top: 6px; }

  /* STORAGE/儲值 */
  .store-card {
    background: linear-gradient(135deg, rgba(240,192,64,0.08) 0%, var(--dark2) 100%);
    border: 1px solid rgba(240,192,64,0.25);
    border-radius: 10px; padding: 14px;
    margin-bottom: 12px;
  }
  .store-card .store-name { font-size: 14px; font-weight: 600; color: #f0c040; }
  .store-card .store-price { font-size: 18px; font-weight: 900; color: var(--gold); margin-top: 4px; }
  .store-card .store-note { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  /* EMPTY / HIDDEN */
  .tab-panel { display: none; }
  .tab-panel.active { display: flex; height: 100%; }
  .hidden { display: none !important; }
  .no-result { padding: 60px 0; text-align: center; color: var(--text-dim); font-size: 14px; }

  /* SCROLLBAR */
  .main::-webkit-scrollbar { width: 5px; }
  .main::-webkit-scrollbar-track { background: transparent; }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); }

  /* RESPONSIVE */
  @media (max-width: 700px) {
    .sidebar { width: 160px; }
    .main { padding: 16px; }
    .pkg-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

// ===================== RENDER =====================
const fmt = n => '$' + n.toLocaleString();

function countAllItems() {
  let c = 0;
  Object.values(ITEMS_DATA).forEach(cat => Object.values(cat).forEach(arr => c += arr.length));
  return c;
}

document.getElementById('cnt-items').textContent = countAllItems();
document.getElementById('cnt-packages').textContent = PACKAGES_DATA.length;
document.getElementById('cnt-mjl').textContent = MJL_PACKAGES.length;
document.getElementById('cnt-promo').textContent = PROMO_DATA.length;
document.getElementById('cnt-storage').textContent = STORAGE_DATA.length;
document.getElementById('cnt-products').textContent = PRODUCTS_DATA.length;

function buildItemsTab() {
  const categories = Object.keys(ITEMS_DATA);
  let activeCat = categories[0];
  let activeSub = Object.keys(ITEMS_DATA[activeCat])[0];

  const sidebar = document.createElement('div');
  sidebar.className = 'sidebar';

  const main = document.createElement('div');
  main.className = 'main';

  function renderSidebar() {
    sidebar.innerHTML = '';
    categories.forEach(cat => {
      const sec = document.createElement('div');
      sec.className = 'sidebar-section';
      sec.innerHTML = `<div class="sidebar-label">${cat}</div>`;
      const subs = Object.keys(ITEMS_DATA[cat]);
      subs.forEach(sub => {
        const item = document.createElement('div');
        item.className = 'sidebar-item' + (cat === activeCat && sub === activeSub ? ' active' : '');
        item.innerHTML = `<span>${sub}</span><span class="count">${ITEMS_DATA[cat][sub].length}</span>`;
        item.onclick = () => { activeCat = cat; activeSub = sub; renderSidebar(); renderMain(); };
        sec.appendChild(item);
      });
      sidebar.appendChild(sec);
    });
  }

  function renderMain() {
    const rows = ITEMS_DATA[activeCat][activeSub];
    main.innerHTML = `
      <div class="section-header">
        <div class="section-title">${activeSub}</div>
        <div class="section-sub">${activeCat}</div>
        <div class="result-count">${rows.length} 項</div>
      </div>
      <table class="price-table">
        <thead><tr>
          <th>項目編碼</th><th>項目名稱</th><th>門店</th><th>單位</th><th>售價</th>
        </tr></thead>
        <tbody>
          ${rows.map(r => `<tr>
            <td class="code">${r.code}</td>
            <td>${r.name}</td>
            <td><span class="store-tag">${r.store||'守蔵'}</span></td>
            <td class="unit">${r.unit}</td>
            <td class="price">${fmt(r.price)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    `;
  }

  renderSidebar(); renderMain();
  const wrap = document.createElement('div');
  wrap.className = 'tab-panel active';
  wrap.dataset.tab = 'items';
  wrap.appendChild(sidebar);
  wrap.appendChild(main);
  return wrap;
}

function buildMJLTab() {
  const groups = [...new Set(MJL_PACKAGES.map(p => p.group))];
  let activeGroup = groups[0];

  const sidebar = document.createElement('div');
  sidebar.className = 'sidebar';

  const main = document.createElement('div');
  main.className = 'main';

  function renderSidebar() {
    sidebar.innerHTML = '<div class="sidebar-section"><div class="sidebar-label">系列選擇</div></div>';
    const sec = sidebar.querySelector('.sidebar-section');
    groups.forEach(g => {
      const item = document.createElement('div');
      item.className = 'sidebar-item' + (g === activeGroup ? ' active' : '');
      const cnt = MJL_PACKAGES.filter(p => p.group === g).length;
      item.innerHTML = `<span>${g}</span><span class="count">${cnt}</span>`;
      item.onclick = () => { activeGroup = g; renderSidebar(); renderMain(); };
      sec.appendChild(item);
    });
  }

  function renderMain() {
    const pkgs = MJL_PACKAGES.filter(p => p.group === activeGroup);
    main.innerHTML = `
      <div class="section-header">
        <div class="section-title">${activeGroup}</div>
        <div class="section-sub">猛健樂常態性套組</div>
        <div class="result-count">${pkgs.length} 組</div>
      </div>
      <div class="pkg-grid">${pkgs.map(renderPkgCard).join('')}</div>
    `;
  }

  renderSidebar(); renderMain();
  const wrap = document.createElement('div');
  wrap.className = 'tab-panel';
  wrap.dataset.tab = 'mjl';
  wrap.appendChild(sidebar);
  wrap.appendChild(main);
  return wrap;
}

function renderPkgCard(p) {
  const itemsHTML = p.items.map(it => `
    <div class="pkg-item-row">
      <span class="pkg-item-code">${it.code}</span>
      <span class="pkg-item-name">${it.name}</span>
      ${it.sessions ? `<span class="pkg-item-sessions">${it.sessions}次</span>` : ''}
    </div>`).join('');
  return `
    <div class="pkg-card">
      <div class="pkg-header">
        <div>
          <div class="pkg-name">${p.name}</div>
          <div class="pkg-code">${p.code}</div>
          ${p.limited ? '<span class="limited-badge">⚠ 限購一組</span>' : ''}
        </div>
        <div class="pkg-price">${fmt(p.price)}</div>
      </div>
      <div class="pkg-items">${itemsHTML}</div>
      ${p.note ? `<div class="pkg-footer"><span class="note-text">📅 ${p.note}</span></div>` : ''}
    </div>`;
}

// ===================== ASSEMBLE =====================
const app = document.getElementById('app');
const layout = document.createElement('div');
layout.style.height = 'calc(100vh - 105px)';
layout.style.overflow = 'hidden';

const panels = [
  buildItemsTab(),
  buildPackagesTab(),
  buildMJLTab(),
  buildPromoTab(),
  buildStorageTab(),
  buildProductsTab(),
];
panels.forEach(p => layout.appendChild(p));
app.appendChild(layout);

// TAB SWITCHING
document.querySelectorAll('.nav-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const target = tab.dataset.tab;
    panels.forEach(p => {
      p.classList.toggle('active', p.dataset.tab === target);
    });
  });
});

// SEARCH
document.getElementById('searchInput').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) {
    panels.forEach(p => {
      p.querySelectorAll('tr, .pkg-card, .promo-card, .store-card').forEach(el => el.classList.remove('hidden'));
    });
    return;
  }

  // Activate current visible tab rows
  panels.forEach(panel => {
    if (!panel.classList.contains('active')) return;
    panel.querySelectorAll('tbody tr').forEach(row => {
      row.classList.toggle('hidden', !row.textContent.toLowerCase().includes(q));
    });
    panel.querySelectorAll('.pkg-card').forEach(card => {
      card.classList.toggle('hidden', !card.textContent.toLowerCase().includes(q));
    });
    panel.querySelectorAll('.promo-card').forEach(card => {
      card.classList.toggle('hidden', !card.textContent.toLowerCase().includes(q));
    });
    panel.querySelectorAll('.store-card').forEach(card => {
      card.classList.toggle('hidden', !card.textContent.toLowerCase().includes(q));
    });
  });
});
